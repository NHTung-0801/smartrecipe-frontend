name: Frontend CD — Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment info
        run: |
          vercel pull --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project with Vercel
        run: |
          vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            2>&1 | tail -1)
          echo "deployment_url=$url" >> $GITHUB_OUTPUT
          echo "✅ Deployed to: $url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify deployment URL responds
        run: |
          deployment_url="${{ steps.deploy.outputs.deployment_url }}"
          echo "🔍 Checking $deployment_url ..."
          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 20 \
            "$deployment_url")
          if [ "$http_code" = "200" ]; then
            echo "✅ Frontend is live! (HTTP 200)"
          else
            echo "⚠️ Got HTTP $http_code — Vercel may still be propagating CDN"
          fi

      - name: Deployment summary
        run: |
          echo "🎉 Frontend deployed successfully!"
          echo "   Production URL: ${{ steps.deploy.outputs.deployment_url }}"
