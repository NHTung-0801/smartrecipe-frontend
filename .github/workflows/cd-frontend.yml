name: Frontend CD — Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment info
        run: |
          vercel pull --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project with Vercel
        run: |
          vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_BASE_URL: https://smartrecipe-backend.onrender.com/api/v1

      - name: Deploy prebuilt to Vercel
        id: deploy
        run: |
          deploy_output=$(vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          echo "$deploy_output"
          url=$(echo "$deploy_output" | grep -o 'https://[^ ]*\.vercel\.app' | tail -1)
          if [ -z "$url" ]; then
            url="https://smartrecipe-frontend.vercel.app"
          fi
          echo "deployment_url=$url" >> $GITHUB_OUTPUT
          echo "✅ Deployed to: $url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify deployment URL responds
        run: |
          deployment_url="${{ steps.deploy.outputs.deployment_url }}"
          echo "🔍 Checking $deployment_url ..."
          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 20 \
            "$deployment_url" 2>/dev/null || echo "000")
          if [ "$http_code" = "200" ] || [ "$http_code" = "308" ]; then
            echo "✅ Frontend is live! (HTTP $http_code)"
          else
            echo "⚠️ Got HTTP $http_code — Vercel may still be propagating CDN"
          fi

      - name: Deployment summary
        run: |
          echo "🎉 Frontend deployed successfully!"
          echo "   Production URL: ${{ steps.deploy.outputs.deployment_url }}"
