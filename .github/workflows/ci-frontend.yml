name: Frontend CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest unit tests
        run: npm test -- --run
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          # Dùng placeholder trong CI — Vercel sẽ inject giá trị thật khi deploy
          VITE_API_BASE_URL: https://smartrecipe-backend.onrender.com/api/v1

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartrecipe-frontend-dist
          path: dist/
          retention-days: 7
